<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, user-scalable=no">
    <title>SO Regelvideos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Ladeanzeige -->
<div id="loading" class="overlay hidden">
    <div class="spinner"></div>
    <div id="loading-text">Lade…</div>
</div>

<!-- Login -->
<section id="view-login" class="view hidden">
    <div class="login-box">
        <h1>Spiele-Offensive<br><span>Regelvideos</span></h1>
        <p class="hint">Bitte melde dich mit deinem Spiele-Offensive.de Kundenkonto an.</p>
        <label for="login-user">E-Mail-Adresse</label>
        <input id="login-user" class="focusable" type="text" autocomplete="off" data-idx="0">
        <label for="login-pass">Passwort</label>
        <input id="login-pass" class="focusable" type="password" autocomplete="off" data-idx="1">
        <div id="login-submit" class="button focusable" data-idx="2">Anmelden</div>
        <div id="login-error" class="error"></div>
    </div>
</section>

<!-- Spieleauswahl -->
<section id="view-grid" class="view hidden">
    <header class="topbar">
        <h1>Meine Regelvideos <span id="grid-count"></span></h1>
        <div class="keyhints">
            <span class="key red"></span> Abmelden
            <span class="key green"></span> Aktualisieren
            <span class="key back">↩</span> Beenden
        </div>
    </header>
    <div id="grid-scroll">
        <div id="grid"></div>
    </div>
    <div id="grid-empty" class="hidden">Keine Videos mit Videorechten gefunden.</div>
</section>

<!-- Player -->
<section id="view-player" class="view hidden">
    <video id="video" preload="auto"></video>

    <div id="player-osd" class="hidden">
        <div id="osd-game"></div>
        <div id="osd-chapter"></div>
        <div class="osd-bar"><div id="osd-progress"></div></div>
        <div id="osd-time"></div>
        <div class="keyhints">
            ◀ ▶ Spulen &nbsp; ▲ ▼ Kapitel &nbsp; OK Play/Pause &nbsp; CH+/CH− Kapitel vor/zurück &nbsp; ↩ Zurück
        </div>
    </div>

    <div id="player-chapters" class="hidden">
        <h2>Kapitel</h2>
        <ul id="chapter-list"></ul>
    </div>

    <div id="player-status" class="hidden"></div>
    <pre id="player-debug" class="hidden"></pre>
</section>

<script src="js/keys.js"></script>
<script src="js/util.js"></script>
<script src="js/http.js"></script>
<script src="js/credstore.js"></script>
<script src="js/api.js"></script>
<script src="js/view-login.js"></script>
<script src="js/view-grid.js"></script>
<script src="js/view-player.js"></script>
<script src="js/app.js"></script>
</body>
</html>
